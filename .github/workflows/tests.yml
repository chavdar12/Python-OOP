name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Test every exercise from its own folder
        run: |
          # each exercise has its own "project" package, so each runs in its own process
          roots=$(find [0-9]* -name "*test*.py" -not -path "*/__pycache__/*" | while read -r f; do
            d=$(dirname "$f")
            if [ -f "$d/__init__.py" ] && [ -d "$d/../project" ]; then d=$(dirname "$d"); fi
            echo "$d"
          done | sort -u)
          for d in $roots; do (cd "$d" && python -m unittest discover -p "*test*.py") || exit 1; done
